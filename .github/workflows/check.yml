name: Verify development build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: python3 scripts/verify-vendor.py
      - run: cmake -S . -B build/native -DSANITIZE=ON -DCMAKE_C_COMPILER=clang
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure
      - run: npm run test:vectors
      - run: npm run typecheck && npm test && npm run build && npm run demo:build
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - run: npm run contracts:build
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.7.1
      - run: forge test
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-evidence-development
          path: |
            artifacts/browser-results.json
            artifacts/wallet-ui-en.png
            artifacts/wallet-ui-mobile-en.png
            build/native/Testing/Temporary/LastTest.log
            dist/extension
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: scripts/setup-sdk.sh
      - run: scripts/build-firmware.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fap-development-not-beta
          path: |
            dist/flipper_evm_wallet.fap
            dist/firmware-build.json
